spring.application.name=shopapp
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


# Business Rules
app.limits.user.max-addresses=10
app.finance.tax-rate=0.10
app.finance.shipping-flat-rate=15.00
# Local Storage Expiry in Milliseconds (e.g., 24 hours)
app.limits.basket.expiry-ms=86400000

spring.flyway.enabled=true
# Change this to false for now so Flyway doesn't skip anything
spring.flyway.baseline-on-migrate=false 
# Optional: This allows Flyway to fix itself if a migration fails mid-way
spring.flyway.repair-on-migrate=true 

# ? JWT SECURITY CONFIGURATION
# Must match the @Value names in your JwtUtils class exactly
shopapp.jwt.secret=VeloceAerospaceDeepSpaceSecureMasterKey2026!
shopapp.jwt.expirationMs=86400000